BrandName:
  brand_name: "BrandName"
  description: |
    Краткое описание бренда, продуктов и каналов (приложение/сайт/магазины).
    Что считаем релевантным: покупки, ассортимент, скидки, бонусы, сервис, качество.
  aliases:
    - "brandname"
    - "бренднейм"
    - "бренднейм приложение"
  drop_categories:
    - name: "Вакансии и найм"
      description: "Сообщения про вакансии, поиск сотрудников, резюме, HR."
      patterns:
        - "(?i)\\bваканси\\w+\\b"
        - "(?i)\\bтребу(ется|ются)\\b"
    - name: "Локация и ориентир"
      description: "Бренд упомянут только как ориентир, адрес или точка на местности."
      patterns:
        - "(?i)\\b(рядом|около|возле|напротив)\\b.{0,60}\\b(brandname|бренднейм)\\b"
    - name: "Официальный ответ"
      description: "Официальные ответы бренда, PR и служебные сообщения."
      patterns:
        - "(?i)^здравствуйте"
        - "(?i)спасибо\\s+за\\s+обращение"
