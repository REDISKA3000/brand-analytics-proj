BrandName:
  brand_name: "BrandName"
  description: |
    Краткое описание бренда, продуктов и каналов (приложение/сайт/магазины).
    Что считаем релевантным: покупки, ассортимент, скидки, бонусы, сервис, качество.
  aliases:
    - "brandname"
    - "бренднейм"
    - "бренднейм приложение"
  # вакансии / найм
  sure_drop_patterns:
    - "(?i)\\bваканси\\w+\\b"
    - "(?i)\\bтребу(ется|ются)\\b"
    - "(?i)\\bподработк\\w+\\b"
    - "(?i)\\bищем\\b.{0,40}\\b(кассир|продав|мерченда(й|и)зер|грузчик|администратор|промоутер|кладовщик|сотрудник)\\w*\\b"
  # локация/ориентир (косвенное упоминание)
  brand_sure_drop:
    - "(?i)\\b(рядом|около|возле|напротив)\\b.{0,60}\\b(brandname|бренднейм)\\b"
    - "(?i)\\bмежду\\b.{0,80}\\b(brandname|бренднейм)\\b"
    - "(?i)\\b(как\\s+найти|как\\s+добраться|где\\s+находится|адрес|ориентир)\\b.{0,80}\\b(brandname|бренднейм)\\b"
  # омонимы / другие бизнесы
  homonym_noise:
    - "(?i)\\b(brandname|бренднейм)\\b.{0,40}\\b(клиника|ресторан|салон|отель|фитнес|жк\\b)\\b"
  # поисковый/SEO шум
  search_noise_patterns:
    - "(?i)\\b(brandname|бренднейм)\\b.{0,40}\\b(перевод|значение|словарь|википед\\w*|wiki)\\b"
    - "(?i)\\b(brandname|бренднейм)\\b.{0,40}\\b(фильм|сериал|песня|текст|lyrics|скачать|смотреть\\s+онлайн)\\b"
  # официальные ответы
  pr_reply_markers:
    - "(?i)^здравствуйте"
    - "(?i)^добрый\\s+день"
    - "(?i)спасибо\\s+за\\s+обращение"
    - "(?i)с\\s+уважением"
