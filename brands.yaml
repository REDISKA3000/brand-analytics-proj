Familia:
  brand_name: "Familia"
  description: |
    Российская сеть off-price магазинов одежды/обуви/товаров для дома, а также официальное приложение.
    Пользовательские сообщения релевантны, если про покупки, ассортимент, скидки, бонусы, приложение, качество, возвраты, сервис, наличие, цены.
  aliases:
    - "familia"
    - "фамилия"
    - "фамилия магазин"
    - "фамилия приложение"
  sure_drop_patterns:
    # вакансии / найм (AI-generated, constrained)
    - "(?i)(?:ваканс\\w*|требу(ется|ются)\\w*|ищем\\w*|набор\\w*|резюме|собеседован\\w*|hr|рекрутер\\w*).{0,80}(?:кассир\\w*|продав\\w*|мерченда(й|и)зер\\w*|кладовщик\\w*|консультант\\w*|администратор\\w*|промоутер\\w*|грузчик\\w*|сотрудник\\w*|работник\\w*|управляющ\\w*|директор\\w*|менеджер\\w*)"
    - "(?i)(?:ваканс\\w*|требу(ется|ются)\\w*|ищем\\w*|набор\\w*|резюме|собеседован\\w*|hr|рекрутер\\w*).{0,80}(?:familia|фамилия|фамилия\\s+магазин|фамилия\\s+приложение)"

  # локация/ориентир (косвенное упоминание магазина)
  brand_sure_drop:
    - "(?i)(?:рядом|около|возле|напротив|между|ориентир|как\\s+найти|как\\s+добраться|где\\s+наход|адрес|на\\s+карте|метро|в\\s*тц|трц|торгов\\w*\\s+центр|вход|выход|остановк\\w*).{0,80}(?:familia|фамилия|фамилия\\s+магазин|фамилия\\s+приложение)"
    - "(?i)(?:familia|фамилия|фамилия\\s+магазин|фамилия\\s+приложение).{0,80}(?:рядом|около|возле|напротив|между|ориентир|как\\s+найти|как\\s+добраться|где\\s+наход|адрес|на\\s+карте|метро|в\\s*тц|трц|торгов\\w*\\s+центр|вход|выход|остановк\\w*)"

  # омонимы / другие бизнесы
  homonym_noise:
    - "(?i)(?:familia|фамилия|фамилия\\s+магазин|фамилия\\s+приложение).{0,40}(?:клиник\\w*|ресторан|кафе|бар|отел\\w*|гостиниц\\w*|аптек\\w*|салон|автосервис|стоматолог\\w*|фитнес|жк|банк|страхов\\w*|туризм|агентств\\w*|школ\\w*|университет|курсы)"
    - "(?i)(?:клиник\\w*|ресторан|кафе|бар|отел\\w*|гостиниц\\w*|аптек\\w*|салон|автосервис|стоматолог\\w*|фитнес|жк|банк|страхов\\w*|туризм|агентств\\w*|школ\\w*|университет|курсы).{0,40}(?:familia|фамилия|фамилия\\s+магазин|фамилия\\s+приложение)"

  # поисковый/SEO шум не про магазин
  search_noise_patterns:
    - "(?i)(?:значени\\w*|происхожд\\w*|перевод\\w*|википед\\w*|wiki|генеалог\\w*|родослов\\w*|фамили\\w*).{0,40}(?:familia|фамилия|фамилия\\s+магазин|фамилия\\s+приложение)"
    - "(?i)(?:familia|фамилия|фамилия\\s+магазин|фамилия\\s+приложение).{0,40}(?:значени\\w*|происхожд\\w*|перевод\\w*|википед\\w*|wiki|генеалог\\w*|родослов\\w*|фамили\\w*)"

  pr_reply_markers:
    - "(?i)^здравствуйте"
    - "(?i)^добрый\\s+день"
    - "(?i)спасибо\\s+за\\s+обращение"
    - "(?i)с\\s+уважением"
    - "(?i)служба\\s+поддержки"
    - "(?i)официальный\\s+ответ"
    - "(?i)пресс-служба"
    - "(?i)официальное\\s+заявление"

Ekonika:
  brand_name: "Ekonika"
  description: |
    Российский бренд обуви и аксессуаров, магазины и онлайн-каналы.
  aliases:
    - "ekonika"
    - "эконика"
    - "econika"
  sure_drop_patterns:
    - "(?i)(?:авито|resell|ресейл|перепродажа|комиссионный магазин|комиссионка|барахолка|second[- ]hand|секонд[- ]хенд|продам|продаю).{0,80}(?:ekonika|эконика|econika)"
    - "(?i)(?:ekonika|эконика|econika).{0,80}(?:авито|resell|ресейл|перепродажа|комиссионный магазин|комиссионка|барахолка|second[- ]hand|секонд[- ]хенд|продам|продаю)"
    - "(?i)(?:удалено|сообщение удалено|message deleted|botdelite|ботделите|бот делите|bot delete|botdel|botdelit).{0,80}(?:ekonika|эконика|econika)"
    - "(?i)(?:ekonika|эконика|econika).{0,80}(?:удалено|сообщение удалено|message deleted|botdelite|ботделите|бот делите|bot delete|botdel|botdelit)"
    - "(?i)(?:вакансия|работа|требуется|ищем сотрудника|job|вакансии).{0,80}(?:ekonika|эконика|econika)"
    - "(?i)(?:ekonika|эконика|econika).{0,80}(?:вакансия|работа|требуется|ищем сотрудника|job|вакансии)"
    - "(?i)(?:бренд-ревизорро|brand[- ]ревизорро|brandrevizorro|брендревизорро).{0,80}(?:ekonika|эконика|econika)"
    - "(?i)(?:ekonika|эконика|econika).{0,80}(?:бренд-ревизорро|brand[- ]ревизорро|brandrevizorro|брендревизорро)"
  brand_sure_drop:
    - "(?i)(?:ekonika|эконика|econika).{0,80}(?:промокод|скидка|акция|стилист)"
    - "(?i)(?:промокод|скидка|акция|стилист).{0,80}(?:ekonika|эконика|econika)"
  homonym_noise:
    - "(?i)(?:экономика|экономический|экономист|экономить)"
    - "(?i)(?:транспортное средство|марка транспорта|автомобиль|транспорт)"
    - "(?i)(?:другой бренд|компания|пользователь|user|account|аккаунт)"
  search_noise_patterns:
    - "(?i)^\\s*(?:#(?:ekonika|эконика|econika)\\s*)+$"
    - "(?i)^\\s*(?:#(?:ekonika|эконика|econika)\\s*){1,}\\s*$"
    - "(?i)(?:карта|map|maps|гео|геолокация|location).{0,80}(?:ekonika|эконика|econika)"
    - "(?i)(?:ekonika|эконика|econika).{0,80}(?:карта|map|maps|гео|геолокация|location)"
  pr_reply_markers:
    - "(?i)(?:промо|реклама|ad:|advertisement|спонсорский|promo|промокод)"
    - "(?i)(?:ботделите|botdelite|bot delete|удалено|message deleted)"
    - "(?i)(?:бренд-ревизорро|brandrevizorro|brand[- ]ревизорро)"
